<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Playground</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>API通信の練習</h1>
        <div id="posts"></div>
        <button id="load-posts">投稿を取得する</button>
        <h2>新しい投稿</h2>

        <form id="post-form">
            <input type="text" id="post-title" placeholder="投稿タイトル" required />

            <textarea id="post-body" placeholder="投稿本文" required></textarea>

            <button type="submit">投稿する</button>
        </form>
    </main>
    <script src="script.js"></script>
    <script type="module" src="firebase.js"></script>
</body>

</html>
