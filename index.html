<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Playground</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>API通信の練習</h1>

        <!-- Firestoreの投稿一覧 -->
        <h2>Firestoreの投稿</h2>
        <div id="firestore-post"></div>

        <!-- Firestoreの投稿フォーム -->
        <h2>Firestoreに投稿する</h2>
        <form id="firestore-form">
            <input type="text" id="firestore-title" placeholder="タイトル" maxlength="100" required />

            <textarea id="firestore-body" placeholder="本文" maxlength="2000" required></textarea>

            <button type="submit" id="firestore-submit">
                Firestoreに保存
            </button>
        </form>
        <p id="firestore-message" role="status"></p>

        <!-- JSONPlaceholderの練習 -->
        <h2>JSONPlaceholderの投稿</h2>
        <div id="posts"></div>
        <button id="load-posts">投稿を取得する</button>

        <h2>新規投稿</h2>
        <form id="post-form">
            <input type="text" id="post-title" placeholder="投稿タイトル" required />

            <textarea id="post-body" placeholder="投稿本文" required></textarea>

            <button type="submit">投稿する</button>
        </form>
    </main>
    <script type="module" src="script.js"></script>
    <script type="module" src="firebase.js"></script>
</body>

</html>
